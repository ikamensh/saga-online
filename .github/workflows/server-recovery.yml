name: Recover prepared server

# Recover a failed rollback without changing or discarding room checkpoints.
# The archive must already have passed this repository's candidate and deploy gates.
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Server rollout whose candidate and deploy jobs passed
        required: true
        type: string
      release:
        description: SHA-256 of the prepared archive to reactivate
        required: true
        type: string
      expected_current:
        description: Exact failed release currently selected on the host
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: saga-server-rollout
  cancel-in-progress: false

jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: server-rollout
    env:
      SOURCE_RUN: ${{ inputs.source_run_id }}
      RECOVERY_RELEASE: ${{ inputs.release }}
      EXPECTED_CURRENT: ${{ inputs.expected_current }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require a prepared and deployed candidate from trusted main
        run: |
          python3 - <<'PY'
          import os, re
          assert re.fullmatch(r'[1-9][0-9]*', os.environ['SOURCE_RUN'])
          for name in ('RECOVERY_RELEASE', 'EXPECTED_CURRENT'):
              assert re.fullmatch(r'[0-9a-f]{64}', os.environ[name])
          PY
          gh run view "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --json workflowName,event,headBranch,jobs > "$RUNNER_TEMP/source-run.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          run = json.loads((Path(os.environ['RUNNER_TEMP']) / 'source-run.json').read_bytes())
          assert (run['workflowName'], run['event'], run['headBranch']) == ('Server rollout', 'workflow_dispatch', 'main')
          jobs = {job['name']: job for job in run['jobs']}
          for name in ('candidate / test', 'deploy'):
              assert jobs[name]['status'] == 'completed' and jobs[name]['conclusion'] == 'success', jobs[name]
          PY
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          pattern: server-acceptance-*
          merge-multiple: true
          path: dist/recovery/candidate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          name: rollout-expected-${{ inputs.source_run_id }}
          path: dist/recovery/deployed
      - name: Recover through the existing restricted installer and verify public attestation
        env:
          HOST: ${{ vars.SAGA_SERVER_HOST }}
          KEY: ${{ secrets.SAGA_SERVER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SAGA_SERVER_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/server-ci" dist/recovery/receipt
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/server-ci/identity"
          chmod 600 "$RUNNER_TEMP/server-ci/identity"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/server-ci/known_hosts"
          archive="dist/recovery/candidate/online/$RECOVERY_RELEASE.tar.gz"
          printf '%s  %s\n' "$RECOVERY_RELEASE" "$archive" | sha256sum --check
          python3 - <<'PY'
          import json, os
          expected = json.load(open('dist/recovery/deployed/expected.json'))
          assert expected['deployment_release'] == os.environ['RECOVERY_RELEASE'], expected
          PY
          arguments=(host --host "$HOST" --identity "$RUNNER_TEMP/server-ci/identity" --known-hosts "$RUNNER_TEMP/server-ci/known_hosts")
          python3 tools/server_rollout.py "${arguments[@]}" status > dist/recovery/receipt/before.json
          python3 - <<'PY'
          import json, os
          status = json.load(open('dist/recovery/receipt/before.json'))
          assert status['current'] == os.environ['EXPECTED_CURRENT'], status
          assert status['service'] == 'failed' and not status['site_pending'], status
          PY
          python3 tools/server_rollout.py "${arguments[@]}" install --archive "$archive" \
            --expected-current "$EXPECTED_CURRENT" > dist/recovery/receipt/install.json
          python3 - <<'PY'
          import json, os, sys, urllib.request
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from server_rollout import expected_baseline
          expected = expected_baseline(Path('dist/recovery/candidate/online') / (os.environ['RECOVERY_RELEASE'] + '.tar.gz'), 'wss://games.tachyon-ai.eu/play')
          installed = json.load(open('dist/recovery/receipt/install.json'))
          assert installed['service'] == 'active' and installed['health'] == 'ok', installed
          assert installed['attestation'] == expected, installed
          request = urllib.request.Request('https://games.tachyon-ai.eu/server-compatibility.json', headers={'Cache-Control': 'no-cache'})
          with urllib.request.urlopen(request, timeout=30) as response:
              served = json.load(response)
          assert served == expected, served
          Path('dist/recovery/receipt/public.json').write_text(json.dumps(served, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: server-recovery-${{ github.run_id }}
          path: dist/recovery/receipt/
          if-no-files-found: warn
          retention-days: 90
