name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: saga-online
      - uses: actions/checkout@v4
        with:
          repository: ikamensh/saga2d-framework
          path: saga2d
      - uses: actions/checkout@v4
        with:
          repository: ikamensh/sagaforge
          path: sagaforge
      - uses: actions/checkout@v4
        with:
          repository: ikamensh/tribes
          path: tribes
      - uses: actions/checkout@v4
        with:
          repository: ikamensh/warband
          path: warband
      - uses: actions/checkout@v4
        with:
          repository: ikamensh/shardbound
          path: shardbound
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --extra dev
        working-directory: saga-online
      - name: Run tests
        run: uv run pytest -q
        working-directory: saga-online
